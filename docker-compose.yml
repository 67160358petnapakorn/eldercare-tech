services:
  api:
    build:
      context: ./backend
    container_name: eldercare-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://eldercare_user:eldercare_password@db:3306/eldercare
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: eldercare-db
    environment:
      MYSQL_DATABASE: eldercare
      MYSQL_USER: eldercare_user
      MYSQL_PASSWORD: eldercare_password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - eldercare_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  eldercare_mysql_data:
